<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ARKANOID II: REVENGE OF DOH — Arcade &amp; Evolved Edition</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        background: #05060c;
        color: #e8f0ff;
        font-family: 'Courier New', Courier, monospace;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #0e1326 0%, #04050a 80%);
      }
      #viewport-wrap {
        position: relative;
        aspect-ratio: 960 / 768;
        width: min(100vw, calc(100vh * (960 / 768)));
        height: min(100vh, calc(100vw * (768 / 960)));
        box-shadow: 0 0 50px rgba(0, 210, 255, 0.18), 0 0 2px rgba(255, 255, 255, 0.35);
        border-radius: 6px;
        overflow: hidden;
        background: #000;
      }
      canvas#game-canvas,
      canvas#gl-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      canvas#gl-canvas {
        pointer-events: none;
      }
      #ui-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        font-family: 'Courier New', Courier, monospace;
      }
      #ui-overlay .modal-panel {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="viewport-wrap">
        <canvas id="game-canvas" width="960" height="768"></canvas>
        <canvas id="gl-canvas" width="960" height="768"></canvas>
        <div id="ui-overlay"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
